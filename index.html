<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dbontr - terminal portfolio</title>
  <meta name="description" content="dbontr - terminal-style portfolio + publications + interactive tutorials" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="assets/images/favicon.ico" />
  <link rel="icon" href="assets/images/favicon.png" type="image/png" />

  <!-- MathJax for LaTeX rendering (safe for static GitHub Pages) -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="wrap" role="application" aria-label="dbontr terminal portfolio">
    <main class="main">
      <section class="terminal" aria-label="Terminal">
        <div class="screen" id="screen" aria-live="polite" aria-atomic="false">
          <div class="history" id="history">
            <div id="log">
              <div class="boot">
                <pre class="mono">
 ____  _                 _
|  _ \| |__   ___  _ __ | |_ _ __
| | | | '_ \ / _ \| '_ \| __| '__|
| |_| | |_) | (_) | | | | |_| |
|____/|_.__/ \___/|_| |_|\__|_|
                </pre>
                <div class="bootLine">Welcome to dbontr. Type <span class="accent">help</span> to begin.</div>
                <div class="bootLine">Tab cycles suggestions. Right arrow accepts.</div>
              </div>
            </div>

            <div class="promptRow">
              <span class="prompt" aria-hidden="true">dbontr$</span>
              <div class="cmdWrap">
                <span class="ghost" id="ghost" aria-hidden="true">
                  <span class="ghostTyped" id="ghostTyped"></span><span class="ghostRest" id="ghostRest"></span>
                </span>
                <input id="cmd" class="cmd" type="text" autocomplete="off" spellcheck="false" aria-label="Command input" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
