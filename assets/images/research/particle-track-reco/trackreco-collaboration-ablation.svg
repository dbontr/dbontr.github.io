<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">Forced collaboration ablation</title><desc id="d">Throughput change when hit sharing is forced on versus off across all six branch policies on the controlled 500-track subset. Final reconstruction quality is unchanged.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="610" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Collaboration is conditional, not universally beneficial</text><text x="40" y="78" class="sub" text-anchor="start">8 threads · median of 5 repetitions · forced hit sharing versus sharing disabled</text><line x1="140" y1="190" x2="1280" y2="190" stroke="#303943" stroke-width="2"/><line x1="140" y1="440" x2="1280" y2="440" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="444" class="axis" text-anchor="end">-10%</text><line x1="140" y1="390" x2="1280" y2="390" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="394" class="axis" text-anchor="end">-8%</text><line x1="140" y1="340" x2="1280" y2="340" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="344" class="axis" text-anchor="end">-6%</text><line x1="140" y1="290" x2="1280" y2="290" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="294" class="axis" text-anchor="end">-4%</text><line x1="140" y1="240" x2="1280" y2="240" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="244" class="axis" text-anchor="end">-2%</text><line x1="140" y1="190" x2="1280" y2="190" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="194" class="axis" text-anchor="end">0%</text><line x1="140" y1="140" x2="1280" y2="140" stroke="#dfe6eb" stroke-width="1"/><text x="124" y="144" class="axis" text-anchor="end">2%</text><rect x="182" y="190" width="100" height="170.32087946393744" fill="#b65454" stroke="none" rx="0"/><text x="232" y="222" class="label" text-anchor="middle">EKF</text><text x="232" y="380.32087946393744" class="value" text-anchor="middle">-6.8%</text><rect x="372" y="174.93213198506314" width="100" height="15.06786801493687" fill="#3b7f67" stroke="none" rx="0"/><text x="422" y="222" class="label" text-anchor="middle">A*</text><text x="422" y="164.93213198506314" class="value" text-anchor="middle">+0.6%</text><rect x="562" y="190" width="100" height="275.56518247921935" fill="#b65454" stroke="none" rx="0"/><text x="612" y="222" class="label" text-anchor="middle">ACO</text><text x="612" y="485.56518247921935" class="value" text-anchor="middle">-11.0%</text><rect x="752" y="190" width="100" height="36.250453490581926" fill="#b65454" stroke="none" rx="0"/><text x="802" y="222" class="label" text-anchor="middle">PSO</text><text x="802" y="246.25045349058192" class="value" text-anchor="middle">-1.5%</text><rect x="942" y="190" width="100" height="260.15651429822293" fill="#b65454" stroke="none" rx="0"/><text x="992" y="222" class="label" text-anchor="middle">SA</text><text x="992" y="470.15651429822293" class="value" text-anchor="middle">-10.4%</text><rect x="1132" y="190" width="100" height="236.86898387446226" fill="#b65454" stroke="none" rx="0"/><text x="1182" y="222" class="label" text-anchor="middle">Hungarian</text><text x="1182" y="446.8689838744623" class="value" text-anchor="middle">-9.5%</text><text x="40" y="515" class="sub" text-anchor="start">Forced sharing preserved the same final reconstruction quality for every branch, but usually reduced throughput.</text><text x="40" y="542" class="sub" text-anchor="start">The objective-adaptive policy selected its no-sharing fallback for all six branches on this sparse workload.</text><text x="40" y="569" class="small" text-anchor="start">Dense 1,000-track EKF stress test: identical 82.9% efficiency off/on; forced sharing changed throughput by -13.1%; adaptive sharing again fell back off.</text></svg>