<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">TrackReco thread scaling</title><desc id="d">Measured TrackReco EKF throughput from one to sixteen threads on the controlled 500-track subset. Throughput rises through eight threads and falls at sixteen on this small workload.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="610" fill="white"/><text x="40" y="50" class="title" text-anchor="start">TrackReco scaling with thread count</text><text x="40" y="78" class="sub" text-anchor="start">EKF branch · 500-track subset · median of 9 repetitions · final quality unchanged at every point</text><line x1="165" y1="430" x2="1280" y2="430" stroke="#dfe6eb" stroke-width="1"/><text x="145" y="434" class="axis" text-anchor="end">0k</text><line x1="165" y1="351.25" x2="1280" y2="351.25" stroke="#dfe6eb" stroke-width="1"/><text x="145" y="355.25" class="axis" text-anchor="end">50k</text><line x1="165" y1="272.5" x2="1280" y2="272.5" stroke="#dfe6eb" stroke-width="1"/><text x="145" y="276.5" class="axis" text-anchor="end">100k</text><line x1="165" y1="193.75" x2="1280" y2="193.75" stroke="#dfe6eb" stroke-width="1"/><text x="145" y="197.75" class="axis" text-anchor="end">150k</text><line x1="165" y1="115" x2="1280" y2="115" stroke="#dfe6eb" stroke-width="1"/><text x="145" y="119" class="axis" text-anchor="end">200k</text><text x="56" y="285" class="axis" text-anchor="middle">Tracks / second</text><polyline points="165,247.9615 443.75,193.313725 722.5,156.105925 1001.25,138.01704999999998 1280,367.3674475" fill="none" stroke="#2f6f9f" stroke-width="4"/><circle cx="165" cy="247.9615" r="7" fill="white" stroke="#2f6f9f" stroke-width="4"/><text x="165" y="231.9615" class="value" text-anchor="middle">115.6k</text><text x="165" y="462" class="label" text-anchor="middle">1</text><text x="165" y="482" class="small" text-anchor="middle">1.00×</text><circle cx="443.75" cy="193.313725" r="7" fill="white" stroke="#2f6f9f" stroke-width="4"/><text x="443.75" y="177.313725" class="value" text-anchor="middle">150.3k</text><text x="443.75" y="462" class="label" text-anchor="middle">2</text><text x="443.75" y="482" class="small" text-anchor="middle">1.30×</text><circle cx="722.5" cy="156.105925" r="7" fill="white" stroke="#2f6f9f" stroke-width="4"/><text x="722.5" y="140.105925" class="value" text-anchor="middle">173.9k</text><text x="722.5" y="462" class="label" text-anchor="middle">4</text><text x="722.5" y="482" class="small" text-anchor="middle">1.50×</text><circle cx="1001.25" cy="138.01704999999998" r="7" fill="white" stroke="#2f6f9f" stroke-width="4"/><text x="1001.25" y="122.01704999999998" class="value" text-anchor="middle">185.4k</text><text x="1001.25" y="462" class="label" text-anchor="middle">8</text><text x="1001.25" y="482" class="small" text-anchor="middle">1.60×</text><circle cx="1280" cy="367.3674475" r="7" fill="white" stroke="#2f6f9f" stroke-width="4"/><text x="1280" y="351.3674475" class="value" text-anchor="middle">39.8k</text><text x="1280" y="462" class="label" text-anchor="middle">16</text><text x="1280" y="482" class="small" text-anchor="middle">0.34×</text><text x="722.5" y="520" class="axis" text-anchor="middle">Threads</text><text x="40" y="565" class="small" text-anchor="start">Throughput peaks at 8 threads on this small event; at 16 threads, synchronization/scheduling overhead dominates. Reconstruction remains 100% efficient with 0% fake and duplicate rates.</text></svg>