<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 590" role="img" aria-labelledby="t d"><title id="t">Branch policy reconstruction time</title><desc id="d">Measured single-thread median reconstruction time for EKF, A*, ACO, PSO, SA, and Hungarian on the controlled 500-track TrackML subset.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="590" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Branch policies: final quality is similar, compute cost is not</text><text x="40" y="78" class="sub" text-anchor="start">Current revision 48a913c · 1 thread · median of 3 repetitions</text><line x1="190" y1="105" x2="190" y2="500" stroke="#dfe6eb" stroke-width="1"/><text x="190" y="526" class="axis" text-anchor="middle">0</text><line x1="452.5" y1="105" x2="452.5" y2="500" stroke="#dfe6eb" stroke-width="1"/><text x="452.5" y="526" class="axis" text-anchor="middle">2</text><line x1="715" y1="105" x2="715" y2="500" stroke="#dfe6eb" stroke-width="1"/><text x="715" y="526" class="axis" text-anchor="middle">4</text><line x1="977.5" y1="105" x2="977.5" y2="500" stroke="#dfe6eb" stroke-width="1"/><text x="977.5" y="526" class="axis" text-anchor="middle">6</text><line x1="1240" y1="105" x2="1240" y2="500" stroke="#dfe6eb" stroke-width="1"/><text x="1240" y="526" class="axis" text-anchor="middle">8</text><text x="715" y="558" class="axis" text-anchor="middle">Median reconstruction time per event (ms)</text><text x="172" y="141" class="label" text-anchor="end">EKF</text><rect x="190" y="115" width="496.0528125" height="38" fill="#2f6f9f" stroke="none" rx="0"/><text x="698.0528125000001" y="141" class="value" text-anchor="start">3.78 ms</text><text x="172" y="203" class="label" text-anchor="end">A*</text><rect x="190" y="177" width="525.6181875" height="38" fill="#2f6f9f" stroke="none" rx="0"/><text x="727.6181875" y="203" class="value" text-anchor="start">4.00 ms</text><text x="172" y="265" class="label" text-anchor="end">ACO</text><rect x="190" y="239" width="497.6895" height="38" fill="#2f6f9f" stroke="none" rx="0"/><text x="699.6895" y="265" class="value" text-anchor="start">3.79 ms</text><text x="172" y="327" class="label" text-anchor="end">PSO</text><rect x="190" y="301" width="498.37462500000004" height="38" fill="#2f6f9f" stroke="none" rx="0"/><text x="700.374625" y="327" class="value" text-anchor="start">3.80 ms</text><text x="172" y="389" class="label" text-anchor="end">SA</text><rect x="190" y="363" width="501.9433125" height="38" fill="#2f6f9f" stroke="none" rx="0"/><text x="703.9433125" y="389" class="value" text-anchor="start">3.82 ms</text><text x="172" y="451" class="label" text-anchor="end">Hungarian</text><rect x="190" y="425" width="1000.0252499999999" height="38" fill="#b97935" stroke="none" rx="0"/><text x="1202.02525" y="451" class="value" text-anchor="start">7.62 ms</text><text x="40" y="575" class="small" text-anchor="start">EKF, A*, ACO, PSO, and SA: 100% efficiency with 0% fake and duplicate rates. Hungarian: 100% efficiency with one duplicate track.</text></svg>