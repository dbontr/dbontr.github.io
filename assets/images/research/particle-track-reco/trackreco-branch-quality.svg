lass="value" text-anchor="middle">0.00%</text><rect x="402" y="420" width="92" height="0" fill="#2f6f9f" stroke="none" rx="0"/><text x="448" y="450" class="label" text-anchor="middle">A*</text><text x="448" y="410" class="value" text-anchor="middle">0.00%</text><rect x="582" y="420" width="92" height="0" fill="#2f6f9f" stroke="none" rx="0"/><text x="628" y="450" class="label" text-anchor="middle">ACO</text><text x="628" y="410" class="value" text-anchor="middle">0.00%</text><rect x="762" y="420" width="92" height="0" fill="#2f6f9f" stroke="none" rx="0"/><text x="808" y="450" class="label" text-anchor="middle">PSO</text><text x="808" y="410" class="value" text-anchor="middle">0.00%</text><rect x="942" y="420" width="92" height="0" fill="#2f6f9f" stroke="none" rx="0"/><text x="988" y="450" class="label" text-anchor="middle">SA</text><text x="988" y="410" class="value" text-anchor="middle">0.00%</text><rect x="1122" y="204.43092" width="92" height="215.56908" fill="#b97935" stroke="none" rx="0"/><text x="1168" y="450" class="label" text-anchor="middle">Hungarian</text><text x="1168" y="194.43092" class="value" text-anchor="middle">0.20%</text><text x="40" y="525" class="small" text-anchor="start">Five policies return exactly 500 tracks for 500 references; Hungarian returns 501 because of one duplicate.</text></svg>