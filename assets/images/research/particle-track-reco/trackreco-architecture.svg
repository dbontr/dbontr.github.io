<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">TrackReco reconstruction architecture</title><desc id="d">Six interchangeable branch policies feed a shared downstream reconstruction stack: helical state estimation, hit ownership, trajectory completion, fragment closure, and final tracks.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="650" fill="white"/><text x="40" y="55" class="title" text-anchor="start">TrackReco reconstruction architecture</text><text x="40" y="84" class="sub" text-anchor="start">Interchangeable search policies feed a shared downstream reconstruction and closure stack.</text><rect x="40" y="135" width="300" height="400" fill="#f8fbfd" stroke="#7fa7c2" rx="10"/><text x="190" y="170" class="label" text-anchor="middle">Candidate search policies</text><rect x="75" y="180" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="203" class="label" text-anchor="middle">EKF</text><rect x="75" y="228" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="251" class="label" text-anchor="middle">A*</text><rect x="75" y="276" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="299" class="label" text-anchor="middle">ACO</text><rect x="75" y="324" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="347" class="label" text-anchor="middle">PSO</text><rect x="75" y="372" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="395" class="label" text-anchor="middle">SA</text><rect x="75" y="420" width="230" height="34" fill="white" stroke="#dceaf4" rx="5"/><text x="190" y="443" class="label" text-anchor="middle">Hungarian</text><rect x="390" y="160" width="970" height="340" fill="white" stroke="#2f6f9f" rx="10"/><rect x="390" y="160" width="970" height="340" fill="none" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="8 6" rx="10"/><text x="875" y="188" class="label" text-anchor="middle">Shared reconstruction core</text><rect x="430" y="220" width="150" height="210" fill="#f8fbfd" stroke="#7fa7c2" rx="8"/><text x="505" y="260" class="label" text-anchor="middle">Helical state</text><text x="505" y="282" class="label" text-anchor="middle">estimation</text><path d="M450 360 C470 290 490 420 510 345 C530 275 550 410 565 330" fill="none" stroke="#2f6f9f" stroke-width="4"/><path d="M580 325 H608" stroke="#2f6f9f" stroke-width="3" marker-end="url(#a)"/><rect x="620" y="220" width="150" height="210" fill="#f8fbfd" stroke="#7fa7c2" rx="8"/><text x="695" y="260" class="label" text-anchor="middle">Hit ownership +</text><text x="695" y="282" class="label" text-anchor="middle">conflict resolution</text><line x1="650" y1="350" x2="695" y2="320" stroke="#2f6f9f" stroke-width="3"/><line x1="740" y1="350" x2="695" y2="320" stroke="#6f7b86" stroke-width="3"/><line x1="650" y1="290" x2="695" y2="320" stroke="#6f7b86" stroke-width="3"/><line x1="740" y1="290" x2="695" y2="320" stroke="#2f6f9f" stroke-width="3"/><circle cx="695" cy="320" r="10" fill="none" stroke="#b65454" stroke-width="3"/><path d="M770 325 H818" stroke="#2f6f9f" stroke-width="3" marker-end="url(#a)"/><rect x="830" y="220" width="150" height="210" fill="#f8fbfd" stroke="#7fa7c2" rx="8"/><text x="905" y="260" class="label" text-anchor="middle">Trajectory</text><text x="905" y="282" class="label" text-anchor="middle">completion</text><polyline points="858,370 888,345 915,315" fill="none" stroke="#2f6f9f" stroke-width="4"/><polyline points="915,315 942,285 962,270" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="8 6"/><path d="M980 325 H1008" stroke="#2f6f9f" stroke-width="3" marker-end="url(#a)"/><rect x="1020" y="220" width="150" height="210" fill="#f8fbfd" stroke="#7fa7c2" rx="8"/><text x="1095" y="260" class="label" text-anchor="middle">Fragment / duplicate</text><text x="1095" y="282" class="label" text-anchor="middle">closure</text><polyline points="1045,370 1075,340 1098,315" fill="none" stroke="#3b7f67" stroke-width="4"/><polyline points="1115,300 1138,278 1155,265" fill="none" stroke="#3b7f67" stroke-width="4"/><text x="1095" y="395" class="small" text-anchor="middle">merge / suppress</text><path d="M1170 325 H1198" stroke="#2f6f9f" stroke-width="3" marker-end="url(#a)"/><rect x="1210" y="220" width="150" height="210" fill="#f8fbfd" stroke="#7fa7c2" rx="8"/><text x="1285" y="260" class="label" text-anchor="middle">Final track</text><text x="1285" y="282" class="label" text-anchor="middle">collection</text><polyline points="1234,365 1270,345 1308,318 1338,290" fill="none" stroke="#2f6f9f" stroke-width="4"/><polyline points="1234,337 1270,317 1308,290 1338,262" fill="none" stroke="#3b7f67" stroke-width="4"/><polyline points="1234,309 1270,289 1308,262 1338,234" fill="none" stroke="#b97935" stroke-width="4"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f9f"/></marker></defs><path d="M340 325 H418" stroke="#2f6f9f" stroke-width="3" marker-end="url(#a)"/><text x="40" y="585" class="sub" text-anchor="start">The distinctive work is downstream: completion and fragment closure convert candidate tracks into a consistent final collection.</text></svg>