<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">Trajectory completion and fragment closure ablation</title><desc id="d">Ablation showing that disabling trajectory completion and fragment closure preserves efficiency but raises duplicate rate to 27.27 percent and fake rate to 0.58 percent, producing 693 tracks instead of 500.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="610" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Closure is the dominant reconstruction-quality contribution</text><text x="40" y="78" class="sub" text-anchor="start">Controlled 500-track subset · 1 thread · median of 5 repetitions</text><line x1="120" y1="430" x2="1280" y2="430" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="434" class="axis" text-anchor="end">0%</text><line x1="120" y1="380" x2="1280" y2="380" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="384" class="axis" text-anchor="end">5%</text><line x1="120" y1="330" x2="1280" y2="330" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="334" class="axis" text-anchor="end">10%</text><line x1="120" y1="280" x2="1280" y2="280" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="284" class="axis" text-anchor="end">15%</text><line x1="120" y1="230" x2="1280" y2="230" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="234" class="axis" text-anchor="end">20%</text><line x1="120" y1="180" x2="1280" y2="180" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="184" class="axis" text-anchor="end">25%</text><line x1="120" y1="130" x2="1280" y2="130" stroke="#dfe6eb" stroke-width="1"/><text x="104" y="134" class="axis" text-anchor="end">30%</text><rect x="160" y="430" width="62" height="0" fill="#7fa7c2" stroke="none" rx="0"/><rect x="232" y="430" width="62" height="0" fill="#b65454" stroke="none" rx="0"/><text x="191" y="422" class="value" text-anchor="middle">0.00%</text><text x="263" y="422" class="value" text-anchor="middle">0.00%</text><text x="227" y="462" class="small" text-anchor="middle">Full reconstruction</text><rect x="460" y="424.22799" width="62" height="5.772009999999999" fill="#7fa7c2" stroke="none" rx="0"/><rect x="532" y="157.27299999999997" width="62" height="272.72700000000003" fill="#b65454" stroke="none" rx="0"/><text x="491" y="416.22799" class="value" text-anchor="middle">0.58%</text><text x="563" y="149.27299999999997" class="value" text-anchor="middle">27.27%</text><text x="527" y="462" class="small" text-anchor="middle">No completion / closure</text><rect x="760" y="430" width="62" height="0" fill="#7fa7c2" stroke="none" rx="0"/><rect x="832" y="430" width="62" height="0" fill="#b65454" stroke="none" rx="0"/><text x="791" y="422" class="value" text-anchor="middle">0.00%</text><text x="863" y="422" class="value" text-anchor="middle">0.00%</text><text x="827" y="462" class="small" text-anchor="middle">No refinement</text><rect x="1060" y="424.22799" width="62" height="5.772009999999999" fill="#7fa7c2" stroke="none" rx="0"/><rect x="1132" y="157.27299999999997" width="62" height="272.72700000000003" fill="#b65454" stroke="none" rx="0"/><text x="1091" y="416.22799" class="value" text-anchor="middle">0.58%</text><text x="1163" y="149.27299999999997" class="value" text-anchor="middle">27.27%</text><text x="1127" y="462" class="small" text-anchor="middle">No completion / closure</text><text x="1127" y="480" class="small" text-anchor="middle">+ no refinement</text><rect x="920" y="95" width="18" height="18" fill="#7fa7c2" stroke="none" rx="0"/><text x="946" y="109" class="small" text-anchor="start">Fake rate</text><rect x="1040" y="95" width="18" height="18" fill="#b65454" stroke="none" rx="0"/><text x="1066" y="109" class="small" text-anchor="start">Duplicate rate</text><text x="40" y="565" class="sub" text-anchor="start">Without completion / closure: 693 reconstructed tracks for 500 references. Full reconstruction returns exactly 500 tracks with 0% fake and duplicate rates.</text></svg>