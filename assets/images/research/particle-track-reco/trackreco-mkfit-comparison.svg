<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">Same-machine TrackReco and mkFit timing reference</title><desc id="d">Same-machine timing reference at one and eight threads for TrackReco full reconstruction engine, mkFit total event loop, and mkFit CloneEngine build stage on the same 500-track TrackML selection.</desc><style>text{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#303943}.title{font-size:28px;font-weight:700;fill:#173a5e}.sub{font-size:15px;fill:#6f7b86}.axis{font-size:13px;fill:#6f7b86}.label{font-size:15px}.small{font-size:12px;fill:#6f7b86}.value{font-size:14px;font-weight:700}</style><rect width="1400" height="620" fill="white"/><text x="40" y="50" class="title" text-anchor="start">Same-machine timing reference: TrackReco and mkFit</text><text x="40" y="78" class="sub" text-anchor="start">Jupiter · same 500-track selection · median of 9 measured runs after warm-up</text><line x1="150" y1="420" x2="1260" y2="420" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="424" class="axis" text-anchor="end">0 ms</text><line x1="150" y1="360" x2="1260" y2="360" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="364" class="axis" text-anchor="end">1 ms</text><line x1="150" y1="300" x2="1260" y2="300" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="304" class="axis" text-anchor="end">2 ms</text><line x1="150" y1="240" x2="1260" y2="240" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="244" class="axis" text-anchor="end">3 ms</text><line x1="150" y1="180" x2="1260" y2="180" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="184" class="axis" text-anchor="end">4 ms</text><line x1="150" y1="120" x2="1260" y2="120" stroke="#dfe6eb" stroke-width="1"/><text x="132" y="124" class="axis" text-anchor="end">5 ms</text><rect x="260" y="160.43880000000001" width="78" height="259.5612" fill="#2f6f9f" stroke="none" rx="0"/><text x="299" y="150.43880000000001" class="value" text-anchor="middle">4.33 ms</text><rect x="370" y="147.60000000000002" width="78" height="272.4" fill="#3b7f67" stroke="none" rx="0"/><text x="409" y="137.60000000000002" class="value" text-anchor="middle">4.54 ms</text><rect x="480" y="288.6" width="78" height="131.4" fill="#b97935" stroke="none" rx="0"/><text x="519" y="278.6" class="value" text-anchor="middle">2.19 ms</text><text x="380" y="454" class="label" text-anchor="middle">1 thread</text><rect x="810" y="258.1758" width="78" height="161.82420000000002" fill="#2f6f9f" stroke="none" rx="0"/><text x="849" y="248.17579999999998" class="value" text-anchor="middle">2.70 ms</text><rect x="920" y="282" width="78" height="138" fill="#3b7f67" stroke="none" rx="0"/><text x="959" y="272" class="value" text-anchor="middle">2.30 ms</text><rect x="1030" y="390" width="78" height="30" fill="#b97935" stroke="none" rx="0"/><text x="1069" y="380" class="value" text-anchor="middle">0.50 ms</text><text x="930" y="454" class="label" text-anchor="middle">8 threads</text><rect x="300" y="500" width="18" height="18" fill="#2f6f9f" stroke="none" rx="0"/><text x="328" y="514" class="small" text-anchor="start">TrackReco engine</text><rect x="600" y="500" width="18" height="18" fill="#3b7f67" stroke="none" rx="0"/><text x="628" y="514" class="small" text-anchor="start">mkFit total event</text><rect x="900" y="500" width="18" height="18" fill="#b97935" stroke="none" rx="0"/><text x="928" y="514" class="small" text-anchor="start">mkFit CloneEngine build</text><text x="40" y="570" class="small" text-anchor="start">Timing scopes are not identical: TrackReco times its reconstruction engine after loading; mkFit reports its internal total event loop and CEMX CloneEngine build stage. Use this as a same-machine implementation reference, not a stage-for-stage equivalence.</text></svg>